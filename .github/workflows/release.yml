name: Release

# Pushing a tag like v0.9.0 builds Billy, signs the update, and publishes a GitHub Release with
# the installer and latest.json, which installed copies of Billy check for updates.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the app version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match the version in tauri.conf.json ($version)."
          }

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch PDFium
        shell: pwsh
        run: ./scripts/fetch-pdfium.ps1

      - name: Fetch PDF.js
        shell: pwsh
        run: ./scripts/fetch-pdfjs.ps1

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Billy ${{ github.ref_name }}
          releaseBody: |
            Download `Billy_…_x64-setup.exe` below and run it. Billy installs for your user account only.

            If you already have Billy, it offers this update by itself.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
