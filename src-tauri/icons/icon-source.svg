<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Billy's app icon: a shelf of books, one leaning. Regenerate the icon files with
       `npm run tauri icon src-tauri/icons/icon-source.svg`. -->
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a6634"/>
      <stop offset="1" stop-color="#7a4e24"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#wood)"/>
  <!-- Books, standing on the shelf at y = 752. -->
  <rect x="232" y="344" width="108" height="408" rx="16" fill="#f6efe2"/>
  <rect x="232" y="424" width="108" height="22" fill="#d8b98c"/>
  <rect x="232" y="652" width="108" height="22" fill="#d8b98c"/>
  <rect x="356" y="288" width="96" height="464" rx="16" fill="#e7c99d"/>
  <rect x="356" y="380" width="96" height="18" fill="#b98a55"/>
  <rect x="468" y="400" width="112" height="352" rx="16" fill="#f6efe2"/>
  <rect x="468" y="470" width="112" height="22" fill="#d8b98c"/>
  <g transform="rotate(-14 770 752)">
    <rect x="670" y="372" width="100" height="380" rx="16" fill="#e7c99d"/>
    <rect x="670" y="452" width="100" height="18" fill="#b98a55"/>
  </g>
  <!-- The shelf. -->
  <rect x="192" y="752" width="640" height="52" rx="14" fill="#f6efe2"/>
</svg>
